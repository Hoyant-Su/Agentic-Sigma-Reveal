[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sigma-reveal"
version = "0.1.0"
description = "Task-conditioned, budgeted initial workspace observation for CLI agent harnesses"
requires-python = ">=3.10"

[project.scripts]
sigma-reveal = "sigma_reveal:main"

[project.urls]
Repository = "https://github.com/Hoyant-Su/Agentic-Sigma-Reveal"
Paper = "https://arxiv.org/abs/2605.08013"

[tool.setuptools]
py-modules = ["sigma_reveal"]
