[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-sigma-reveal"
version = "0.2.0"
description = "Task-conditioned, budgeted initial workspace observation for CLI agent harnesses"
requires-python = ">=3.10"
readme = "USAGE.md"
keywords = ["agent-harness", "context-selection", "cli-agent", "sigma-reveal"]

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3"]
deepagents = ["deepagents>=0.7.13,<0.8"]

[project.scripts]
sigma-reveal = "sigma_reveal:main"
sigma-reveal-mcp = "sigma_reveal_mcp:main"

[project.urls]
Repository = "https://github.com/Hoyant-Su/Agentic-Sigma-Reveal"
Paper = "https://arxiv.org/abs/2605.08013"

[tool.setuptools]
py-modules = ["sigma_reveal", "sigma_reveal_reference", "sigma_reveal_mcp"]
